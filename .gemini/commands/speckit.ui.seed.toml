## Completion Report

Report completion to the user with the target (shared or Route ID), the UI spec path(s) written as defined in `.specify/ui/core.md`, and any needs marked `No fit in pool` or `fallback:shadcn`.

## Key rules

- Use absolute paths for filesystem operations; use project-relative paths for references in documentation
- Never edit route structure
- Do not invent components

